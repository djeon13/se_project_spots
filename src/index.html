<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Photo Share" />
        <meta name="author" content="Da In Jeon" />
        <meta name="keywords" content="HTML,CSS,???" />
       
        <title>Spots</title>
    </head>
    <body>
        <div class="page">
            <header class="header">
                <img
    src="<%= require('./images/logo.svg')%>"
    alt="header logo"
    class="header__logo"
/>
            </header>
            <main class="content">
                <section class="profile page__section">
                    <div class="profile__image-container">
                    <img
                        src="<%= require('./images/avatar.jpg')%>" alt="Avatar"
                        class="profile__avatar"
                    /><button type="button" class="profile__edit-avatar-btn">
                    <img
                    src="<%= require('./images/Avataredit.png')%>"
                    alt="Edit Avatar"
                    class="profile__edit-icon"
                    />
                    <span class="profile__edit-text">Edit Avatar</span>
                    </button>
                    </div>
                    <div class="profile__column">
                        <h1 class="profile__name">Bessie Coleman</h1>
                        <p class="profile__description">Civil Aviator</p>
                        <button type="button" class="profile__edit-btn">
                            <img
                                src="<%= require('./images/Group2.svg')%>"
                                alt="Pencil Icon"
                            />Edit Profile
                        </button>
                    </div>
                    <button type="button" class="profile__add-btn">
                        <img src="<%= require('./images/Plus.svg')%>" alt="Plus Icon" />New Post
                    </button>
                </section>
                <section class="cards page__section">
                    <ul class="cards__list">
                        <template id="card-template">
                            <li class="card">
                                <button
                                    class="card__delete-button"
                                    type="button"
                                ></button>
                                <img src="#" alt="" class="card__image" />
                                <div class="card__content">
                                    <h2 class="card__title"></h2>
                                    <button
                                        type="button"
                                        class="card__like-btn"
                                    ></button>
                                </div>
                            </li>
                        </template>
                    </ul>
                </section>
            </main>
            <footer class="footer">
                <p class="footer__copyright">2025 &copy; Spots</p>
            </footer>

            <div class="modal" id="edit-profile-modal">
                <div class="modal__container">
                    <button type="button" class="modal__close-btn">
                        <img src="<%= require('./images/Group27.svg')%>" alt="close icon" />
                    </button>
                    <h2 class="modal__title">Edit Profile</h2>
                    <form class="modal__form">
                        <label for="profile-name-input" class="modal__label"
                            >Name
                            <input minlength="2" maxlength="40"
                                id="profile-name-input"
                                type="text"
                                class="modal__input"
                                placeholder="Type your name"
                                required
                            />
                            <span id="profile-name-input-error" class="modal__error"></span>
                        </label>
                        <label 
                            for="profile-description-input"
                            class="modal__label"
                        >
                            Description
                            <input minlength="2" maxlength="200"
                                id="profile-description-input"
                                type="text"
                                class="modal__input"
                                placeholder="Describe yourself"
                                required
                            />
                            <span id="profile-description-input-error" class="modal__error"></span>
                        </label>
                        <button class="modal__submit-btn" type="submit">
                            Save
                        </button>
                    </form>
                </div>
            </div>
            <div class="modal" id="new-post-modal">
                <div class="modal__container">
                    <button type="button" class="modal__close-btn">
                        <img src="<%= require('./images/Group27.svg')%>" alt="close icon" />
                    </button>
                    <h2 class="modal__title">New Post</h2>
                    <form class="modal__form">
                        <label for="card-image-input" class="modal__label"
                            >Image Link
                            <input
                                id="card-image-input"
                                type="url"
                                class="modal__input"
                                placeholder="Paste a link to the picture"
                                required
                            />
                            <span id="card-image-input-error" class="modal__error"></span>
                        </label>
                        <label
                            for="caption-description-input"
                            class="modal__label"
                        >
                            Caption
                            <input minlength="2" maxlength="30"
                                id="caption-description-input"
                                type="text"
                                class="modal__input"
                                placeholder="Type your caption"
                                required
                            />
                            <span id="caption-description-input-error" class="modal__error"></span>
                        </label>
                        <button class="modal__submit-btn" type="submit">
                            Save
                        </button>
                    </form>
                </div>
            </div>
            <div class="modal" id="preview-modal">
                <div class="modal__image-container">
                    <button
                        type="button"
                        class="modal__close-btn modal__close-btn_type_preview"
                    >
                        <img src="<%= require('./images/Previewclose.svg')%>" alt="close icon" />
                    </button>
                    <img src="#" alt="" class="modal__image" />
                    <p class="modal__caption"></p>
                </div>
            </div>
            <div class="modal" id="delete-modal">
                <div class="modal__container">
                    <p class="modal__title">Are you sure you want to delete this image?</p>
                    <button
                        type="button" 
                        class="modal__close-btn">X
                    </button>
                    <form class="modal__form">
                    <button 
                        type="submit"
                        class="modal__submit-btn modal__submit-btn_type_delete">Delete
                    </button>
                     <button 
                        type="button"
                        class="modal__cancel-btn">Cancel
                    </button>
                    </form>
                </div>
            </div>
            <div class="modal" id="edit-avatar-modal">
                <div class="modal__container">
                    <button type="button" class="modal__close-btn">
                        <img src="<%= require('./images/Group27.svg')%>" alt="close icon" />
                    </button>
                    <h2 class="modal__title">Edit profile avatar</h2>
                    <form class="modal__form">
                    <label for="profile-avatar-input" class="modal__label"
                            >Profile Picture
                            <input minlength="2" maxlength="40"
                                id="profile-avatar-input"
                                type="url"
                                class="modal__input"
                                placeholder="Type your url"
                                required
                            />
                            <span id="profile-avatar-input-error" class="modal__error"></span>
                        </label>
                        <button class="modal__submit-btn" type="submit">
                            Save
                        </button>    
                    </form>
                </div>
            </div>
        </div>
    </body>
</html>
